name: build-windows-colmap_cuda12
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
        with:
          repository: colmap/colmap
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # CUDA 12.4.0 to match the rest of the pipeline
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'
          method: network
          use-github-cache: false
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev","nvrtc","nvrtc_dev"]'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install ninja and cmake
        run: pip install cmake ninja

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: bash
        env:
          CUDA_PATH_V124: ${{ env.CUDA_PATH }}
          # Guard against the windows-2022 MSVC being newer than CUDA 12.4 officially supports
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          CL: "/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCUDA_ENABLED=ON \
            -DGUI_ENABLED=OFF \
            -DTESTS_ENABLED=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc.exe" \
            2>&1 | tee configure.log

      - name: Build
        shell: bash
        env:
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          CL: "/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          set -o pipefail
          cmake --build build --config Release -j 2>&1 | tee build.log || {
            echo "================ ERRORS ================"
            grep -n -i -E "error|FAILED:" build.log | grep -v -i "warning" | head -60
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/src/colmap/exe dist/ 2>/dev/null || true
          find build -name "colmap.exe" -exec cp {} dist/ \;
          find build -name "*.dll" -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmap-cu124-win64
          path: |
            dist/
            build.log
            configure.log
