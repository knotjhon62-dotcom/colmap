name: build-windows-colmap
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_DIR: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Persistent vcpkg binary cache, so packages are not rebuilt every run
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: colmap/colmap
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.0'
          method: network
          use-github-cache: false
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev","nvrtc","nvrtc_dev"]'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install cmake and ninja
        run: pip install cmake ninja

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_DIR"
          & "$env:VCPKG_DIR\bootstrap-vcpkg.bat" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-bin-${{ runner.os }}-

      - name: Configure
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          CL: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DCUDA_ENABLED=ON \
            -DGUI_ENABLED=OFF \
            -DTESTS_ENABLED=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_COMPILER="$CUDA_PATH/bin/nvcc.exe" \
            2>&1 | tee configure.log

      - name: Build
        shell: bash
        env:
          MSYS2_ARG_CONV_EXCL: "*"
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          CL: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
        run: |
          set -o pipefail
          cmake --build build --config Release -j 2>&1 | tee build.log || {
            echo "================ ERRORS ================"
            grep -n -i -E "error|FAILED:" build.log | grep -v -i "warning" | head -60
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          find build -name "colmap.exe" -exec cp {} dist/ \;
          find build -name "*.dll" -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmap-cu124-win64
          path: |
            dist/
            build.log
            configure.log
