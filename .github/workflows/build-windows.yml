name: COLMAP (Windows 10, CUDA 11.8)

on:
  workflow_dispatch:

concurrency:
  group: colmap-win-cu118-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-2019 is retired on GitHub-hosted runners, so jobs requesting it never start.
    # windows-2022 ships MSVC 14.44, which CUDA 11.8 rejects (C1189); pin an older
    # toolset (14.38) via msvc-dev-cmd so nvcc accepts the host compiler.
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      # Binary cache for vcpkg packages (uses the GitHub Actions cache backend).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA 11.8 toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "11.8.0"
          method: network
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev"]'

      - name: Set up MSVC 14.29 (VS 2019) environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.38"

      - name: Install CMake and Ninja
        shell: pwsh
        run: choco install cmake ninja -y --no-progress

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 https://github.com/Microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # No separate "vcpkg install" step: with the toolchain file below, CMake
      # runs vcpkg in manifest mode (vcpkg.json) during configure.
      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = $env:GITHUB_WORKSPACE
          $toolchain = "$src/vcpkg/scripts/buildsystems/vcpkg.cmake"
          New-Item -ItemType Directory -Force -Path "$src/build" | Out-Null
          Set-Location "$src/build"
          cmake .. -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DCUDA_TOOLKIT_ROOT_DIR="$env:CUDA_PATH" `
            -DCMAKE_INSTALL_PREFIX="$src/install" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DGUI_ENABLED=ON `
            -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CL = "/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          Set-Location "$env:GITHUB_WORKSPACE/build"
          ninja -j2 -v
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install into prefix
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:GITHUB_WORKSPACE/build"
          ninja install
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = $env:GITHUB_WORKSPACE
          $dist = "$src/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Recurse -Force "$src/install/*" $dist
          if (-not (Test-Path "$dist/bin/colmap.exe")) {
            throw "colmap.exe not found in dist/bin - install step produced nothing"
          }
          @"
          COLMAP built with CUDA 11.8 on windows-2022 (MSVC 14.38), target GPU sm_86.
          Target OS: Windows 10 x64.
          Run bin/colmap.exe (or bin/colmap.exe gui). Requires an NVIDIA driver that supports CUDA 11.8.
          "@ | Set-Content -Path "$dist/README.txt"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colmap-cu118-win10-build
          path: dist/
          if-no-files-found: warn
          retention-days: 7
