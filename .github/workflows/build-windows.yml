name: COLMAP (Windows, CUDA 11.8)

on:
  workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Windows CUDA 11.8
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '11.8.0'
          method: network
          use-github-cache: false
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev"]'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        shell: pwsh
        run: |
          choco install cmake ninja -y

      - name: Clone and bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          cd vcpkg
          .\vcpkg install --triplet x64-windows

      - name: Configure CMake
        shell: bash
        run: |
          set -o pipefail
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"

          mkdir -p build
          cd build

          cmake .. \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCUDA_TOOLKIT_ROOT_DIR="C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8" \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DGUI_ENABLED=ON \
            -DBUILD_TESTING=OFF \
            2>&1 | tee cmake.log || {
            echo "================ CMAKE ERRORS ================"
            grep -n -i "error\|FAILED:" cmake.log | head -30
            exit 1
          }

      - name: Build
        shell: bash
        env:
          CUDA_HOME: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8"
          DISTUTILS_USE_SDK: "1"
          CL: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          MAX_JOBS: "2"
        run: |
          set -o pipefail
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"

          cd build
          ninja -j2 -v 2>&1 | tee build.log || {
            echo "================ BUILD ERRORS ================"
            grep -n -i "error\|FAILED:" build.log | grep -v "warning" | head -60
            exit 1
          }

      - name: Install
        shell: bash
        run: |
          cd build
          ninja install

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Copy binaries, libraries, and headers
          if [ -d "build/install" ]; then
            cp -r build/install/* dist/ || true
          fi

          # Create README
          cat > dist/README.txt << 'EOF'
          COLMAP built with CUDA 11.8 support
          - GPU architecture: RTX A2000 (compute_86)
          - CUDA: 11.8
          - Python: 3.11

          Contents:
          - bin/: COLMAP executables
          - lib/: Libraries
          - include/: Headers

          To use:
          Add the bin directory to PATH (Windows):
          set PATH=%CD%\bin;%PATH%
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colmap-cu118-build
          path: |
            dist/
            build/cmake.log
            build/build.log
