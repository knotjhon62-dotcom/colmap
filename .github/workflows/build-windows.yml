name: COLMAP (Windows, CUDA 11.8)

on:
  workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Windows CUDA 11.8
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        cuda: [true]
        include:
          - cuda: true
            cuda_version: "11.8"
            artifact_name: colmap-x64-windows-cuda118

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.cuda_version }}.0
          method: network
          use-github-cache: false
          sub-packages: '["nvcc","cudart","thrust","visual_studio_integration","cublas_dev","cusparse_dev","cusolver_dev","curand_dev"]'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CMake and Ninja
        shell: pwsh
        run: |
          choco install cmake ninja -y

      - name: Clone and bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          cd vcpkg
          .\vcpkg install --triplet x64-windows @${{ github.workspace }}/vcpkg-configuration.json

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"

          mkdir -p build
          cd build

          cmake .. \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCUDA_TOOLKIT_ROOT_DIR="C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8" \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-windows \
            -DGUI_ENABLED=ON \
            -DBUILD_TESTING=ON \
            2>&1 | tee cmake.log || {
            echo "================ CMAKE ERRORS ================"
            grep -n -i "error\|FAILED:" cmake.log | head -30
            exit 1
          }

      - name: Build
        shell: bash
        env:
          CUDA_HOME: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v11.8"
          DISTUTILS_USE_SDK: "1"
          CL: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
          MAX_JOBS: "2"
        run: |
          set -o pipefail
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"

          cd build
          ninja -v 2>&1 | tee build.log || {
            echo "================ BUILD ERRORS ================"
            grep -n -i "error\|FAILED:" build.log | grep -v "warning" | head -60
            exit 1
          }

      - name: Run tests
        shell: bash
        working-directory: build
        run: |
          ctest -j 2 --output-on-failure \
            --exclude-regex "feature/sift_test|util/opengl_utils_test|mvs/gpu_mat_test" \
            || true

      - name: Install and export package
        shell: bash
        run: |
          set -o pipefail
          export PATH="$(cygpath -u "$VCToolsInstallDir")bin/HostX64/x64:$PATH"

          cd build
          ninja install

          # Create package directory
          mkdir -p package/${{ matrix.artifact_name }}

          # Copy binaries, libraries, and dependencies
          cp -r install/* package/${{ matrix.artifact_name }}/ || true

          # Verify Qt SVG plugin exists if GUI is enabled
          if [ -f "package/${{ matrix.artifact_name }}/bin/imageformats/qsvg.dll" ]; then
            echo "Qt SVG plugin found"
          else
            echo "Warning: Qt SVG plugin not found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/package/${{ matrix.artifact_name }}/
            build/cmake.log
            build/build.log

      - name: Save compiler cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg-configuration.json') }}
